<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Attributor block bootstrap uncertainty summary</title>
  <desc id="desc">Block-bootstrap confidence intervals are 8.9 times wider than naive row-resampling intervals because the daily MMM residuals are autocorrelated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="wide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; fill: #f8fafc; }
      .muted { fill: #a5b4fc; }
      .small { font-size: 17px; }
      .label { font-size: 21px; font-weight: 600; }
      .value { font-size: 34px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" font-size="34" font-weight="700">Same point estimate · very different decision risk</text>
  <text x="60" y="101" class="muted small">Autocorrelation-aware uncertainty for marketing budget allocation</text>

  <rect x="60" y="140" width="710" height="300" rx="22" fill="#0f172a" fill-opacity=".62" stroke="#4338ca"/>
  <text x="95" y="186" class="label">95% CI width · normalized</text>
  <text x="95" y="230" class="small muted">Naive row bootstrap</text>
  <rect x="95" y="248" width="63" height="30" rx="8" fill="#818cf8"/>
  <text x="175" y="271" class="label">1.0×</text>

  <text x="95" y="330" class="small muted">7-day block bootstrap</text>
  <rect x="95" y="348" width="560" height="30" rx="8" fill="url(#wide)"/>
  <text x="674" y="371" class="value">8.9×</text>
  <text x="95" y="416" class="small muted">Block resampling preserves within-week order; row resampling destroys temporal dependence.</text>

  <g>
    <rect x="815" y="140" width="325" height="86" rx="18" fill="#1e293b"/>
    <text x="845" y="174" class="small muted">Ridge MMM holdout R²</text>
    <text x="845" y="209" class="value">0.42</text>

    <rect x="815" y="246" width="325" height="86" rx="18" fill="#1e293b"/>
    <text x="845" y="280" class="small muted">Revenue uplift · 95% CI</text>
    <text x="845" y="315" font-size="30" font-weight="700">[0.00%, 0.08%]</text>

    <rect x="815" y="352" width="325" height="88" rx="18" fill="#1e293b"/>
    <text x="845" y="386" class="small muted">Measured protocol</text>
    <text x="845" y="420" class="label">913 days · N=200</text>
  </g>

  <line x1="60" y1="480" x2="1140" y2="480" stroke="#4338ca"/>
  <text x="60" y="523" class="label">Near-optimal allocation does not mean the point recommendation is precise.</text>
</svg>
